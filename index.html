<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dash - Synth Wave Runner</title>
    <!-- Tailwind CSS CDN para UI estilizada -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b1a;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Efeito de brilho neon */
        .neon-text-pink {
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.8), 0 0 20px rgba(255, 0, 128, 0.5), 0 0 40px rgba(255, 0, 128, 0.3);
        }

        .neon-text-cyan {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.5), 0 0 40px rgba(0, 243, 255, 0.3);
        }

        .neon-box {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.2);
            border: 1px solid rgba(0, 243, 255, 0.5);
        }

        .neon-button {
            background: linear-gradient(135deg, #ff0080, #7928ca);
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.6);
            transition: all 0.2s ease;
        }

        .neon-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.9);
        }

        .neon-button:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Animação suave de pulso */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }

        .animate-pulse-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }

        /* Overlay Glassmorphism */
        .glass-panel {
            background: rgba(15, 15, 35, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center relative">

    <!-- Canvas Principal do Jogo -->
    <canvas id="gameCanvas" class="w-full h-full absolute inset-0 z-0"></canvas>

    <!-- Hud de Pontuação no Jogo -->
    <div id="hud" class="absolute top-4 left-0 right-0 px-6 flex justify-between items-center z-10 pointer-events-none hidden">
        <div class="glass-panel px-4 py-2 rounded-2xl flex items-center space-x-3 border-cyan-500/30">
            <span class="text-xs uppercase tracking-widest text-cyan-400 font-bold">Pontos</span>
            <span id="scoreDisplay" class="font-orbitron text-2xl font-black text-cyan-300">0</span>
        </div>
        
        <div class="glass-panel px-4 py-2 rounded-2xl flex items-center space-x-3 border-pink-500/30">
            <span class="text-xs uppercase tracking-widest text-pink-400 font-bold">Recorde</span>
            <span id="highScoreHUDDisplay" class="font-orbitron text-xl font-bold text-pink-300">0</span>
        </div>
    </div>

    <!-- Tela Inicial / Menu -->
    <div id="startScreen" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-4">
        <div class="glass-panel p-8 md:p-12 rounded-3xl max-w-md w-full text-center neon-box relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-pink-500/20 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-cyan-500/20 rounded-full blur-2xl"></div>

            <h1 class="font-orbitron text-4xl md:text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 neon-text-pink">
                NEON DASH
            </h1>
            <p class="text-cyan-200/80 mb-8 text-sm md:text-base font-medium">Desvie dos obstáculos e colete orbes de energia no horizonte synthwave!</p>

            <button id="startBtn" class="neon-button w-full py-4 rounded-xl font-orbitron font-bold text-lg tracking-wider text-white mb-6 animate-pulse-glow">
                INICIAR JOGO
            </button>

            <!-- Card de Controles e Dicas -->
            <div class="bg-black/40 rounded-xl p-4 text-xs text-gray-300 space-y-2 border border-white/5">
                <div class="flex justify-between items-center border-b border-white/10 pb-2">
                    <span class="text-cyan-400 font-semibold">PC:</span>
                    <span>Setas / A-D / Arrastar Mouse</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-pink-400 font-semibold">Mobile:</span>
                    <span>Deslize ou Toque nas laterais</span>
                </div>
            </div>

            <div class="mt-6 text-xs text-gray-400 flex justify-center items-center gap-2">
                <span>Recorde Atual:</span>
                <span id="menuHighScore" class="font-orbitron text-pink-400 font-bold text-sm">0</span>
            </div>
        </div>
    </div>

    <!-- Tela de Game Over -->
    <div id="gameOverScreen" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-4 hidden">
        <div class="glass-panel p-8 md:p-10 rounded-3xl max-w-md w-full text-center neon-box border-pink-500/40 relative">
            <h2 class="font-orbitron text-3xl md:text-4xl font-black text-pink-500 mb-1 neon-text-pink">GAME OVER</h2>
            <p id="gameOverReason" class="text-gray-300 text-sm mb-6">Você colidiu com um obstáculo!</p>

            <div class="bg-black/50 rounded-2xl p-4 mb-6 border border-white/10 space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-gray-400 text-sm">Pontuação Final</span>
                    <span id="finalScore" class="font-orbitron text-2xl font-bold text-cyan-400">0</span>
                </div>
                <div class="flex justify-between items-center border-t border-white/10 pt-2">
                    <span class="text-gray-400 text-sm">Melhor Recorde</span>
                    <span id="finalHighScore" class="font-orbitron text-xl font-bold text-pink-400">0</span>
                </div>
            </div>

            <div class="flex gap-3">
                <button id="restartBtn" class="neon-button flex-1 py-3.5 rounded-xl font-orbitron font-bold text-sm tracking-wider text-white">
                    JOGAR NOVAMENTE
                </button>
            </div>
        </div>
    </div>

    <!-- Lógica do Jogo -->
    <script>
        // --- SINTETIZADOR DE ÁUDIO WEB AUDIO API ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playCollect() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15); // C6

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
            }

            playHit() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            }

            playStart() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(440, now + 0.2);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        const audio = new SoundFX();

        // --- SETUP DO CANVAS E VARIÁVEIS DO JOGO ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Elementos da UI
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreHUDDisplay = document.getElementById('highScoreHUDDisplay');
        const menuHighScore = document.getElementById('menuHighScore');
        const finalScore = document.getElementById('finalScore');
        const finalHighScore = document.getElementById('finalHighScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Estado do Jogo
        let gameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('neon_dash_highscore') || 0;
        let speed = 6;
        let frameCount = 0;

        // Configuração de tamanho do Canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Atualizar HighScores na Interface
        menuHighScore.textContent = highScore;
        highScoreHUDDisplay.textContent = highScore;

        // --- PLAYER (NAVE / PERSONAGEM) ---
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            width: 44,
            height: 44,
            targetX: canvas.width / 2,
            speed: 0.18, // Suavidade do movimento (lerp)
            trail: [],

            update() {
                // Interpolação suave para a posição do mouse/toque/teclado
                this.x += (this.targetX - this.x) * this.speed;

                // Limite nas bordas da tela
                this.x = Math.max(this.width / 2, Math.min(canvas.width - this.width / 2, this.x));

                // Atualizar rastro/rastro de néon
                this.trail.push({ x: this.x, y: this.y, alpha: 1.0 });
                if (this.trail.length > 12) {
                    this.trail.shift();
                }
                this.trail.forEach(t => t.alpha -= 0.07);
            },

            draw() {
                // Desenhar Rastro
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i];
                    ctx.beginPath();
                    ctx.arc(t.x, t.y + (12 - i) * 2, (this.width / 2) * (i / this.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 243, 255, ${Math.max(0, t.alpha * 0.4)})`;
                    ctx.fill();
                }

                // Desenhar Nave Neon (Triângulo futurista estilizado)
                ctx.save();
                ctx.translate(this.x, this.y);

                // Brilho Neon
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00f3ff';

                // Corpo da nave
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.lineTo(0, this.height / 3);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.closePath();

                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00f3ff';
                ctx.stroke();

                // Núcleo brilhante
                ctx.beginPath();
                ctx.arc(0, 2, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#ff0080';
                ctx.shadowColor = '#ff0080';
                ctx.fill();

                ctx.restore();
            }
        };

        // --- SISTEMA DE PARTÍCULAS ---
        let particles = [];
        function createExplosion(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = Math.random() * 6 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    size: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // --- OBSTÁCULOS E ORBES DE ENERGIA ---
        let obstacles = [];
        let collectibles = [];

        class Obstacle {
            constructor() {
                this.width = Math.random() * 60 + 40;
                this.height = 20;
                this.x = Math.random() * (canvas.width - this.width) + this.width / 2;
                this.y = -30;
                this.color = '#ff0055';
                this.speed = speed + Math.random() * 1.5;
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = '#11030d';
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.roundRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height, 8);
                ctx.fill();
                ctx.stroke();

                // Linha central animada
                ctx.beginPath();
                ctx.moveTo(this.x - this.width / 3, this.y);
                ctx.lineTo(this.x + this.width / 3, this.y);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();
            }
        }

        class Collectible {
            constructor() {
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = -30;
                this.radius = 12;
                this.color = '#00f3ff';
                this.pulse = 0;
            }

            update() {
                this.y += speed * 0.85;
                this.pulse += 0.08;
            }

            draw() {
                ctx.save();
                const currentRadius = this.radius + Math.sin(this.pulse) * 3;

                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(2, currentRadius), 0, Math.PI * 2);
                ctx.fill();

                // Núcleo Branco
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentRadius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.restore();
            }
        }

        // --- CENÁRIO DE FUNDO SYNTHWAVE / GRID PERSPECTIVA ---
        let gridOffset = 0;
        function drawBackground() {
            // Gradiente do Céu/Fundo
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#050515');
            bgGrad.addColorStop(0.6, '#1a0b2e');
            bgGrad.addColorStop(1, '#090314');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sol Neon Synthwave no fundo
            const sunY = canvas.height * 0.35;
            const sunRadius = Math.min(canvas.width, canvas.height) * 0.18;
            const sunGrad = ctx.createLinearGradient(0, sunY - sunRadius, 0, sunY + sunRadius);
            sunGrad.addColorStop(0, '#ffe600');
            sunGrad.addColorStop(0.5, '#ff007f');
            sunGrad.addColorStop(1, '#7928ca');

            ctx.save();
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff007f';
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, sunY, sunRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Linhas verticais móveis (Efeito Grid Futurista)
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 0, 128, 0.15)';
            ctx.lineWidth = 1.5;

            gridOffset = (gridOffset + speed * 0.75) % 40;

            // Linhas Horizontais
            for (let y = 0; y < canvas.height; y += 40) {
                const lineY = y + gridOffset;
                ctx.beginPath();
                ctx.moveTo(0, lineY);
                ctx.lineTo(canvas.width, lineY);
                ctx.stroke();
            }

            // Linhas Verticais
            const numLines = 16;
            for (let i = 0; i <= numLines; i++) {
                const x = (canvas.width / numLines) * i;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            ctx.restore();
        }

        // --- GERENCIAMENTO DE INPUTS (TECLADO, MOUSE, MOBILE) ---
        let keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
        });
        window.addEventListener('keyup', e => {
            keys[e.key] = false;
        });

        // Controles de Ponteiro (Mouse / Toque)
        function handlePointerMove(e) {
            if (!gameRunning) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.targetX = clientX;
        }

        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('touchmove', handlePointerMove, { passive: true });
        window.addEventListener('touchstart', (e) => {
            if (gameRunning) {
                handlePointerMove(e);
            }
        }, { passive: true });

        function processKeyboardInput() {
            const step = 16;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.targetX -= step;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.targetX += step;
            }
        }

        // --- DETECÇÃO DE COLISÃO ---
        function checkCollisions() {
            // Obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                // Colisão AABB simples com margem ajustada
                const dx = Math.abs(player.x - obs.x);
                const dy = Math.abs(player.y - obs.y);

                if (dx < (player.width / 2 + obs.width / 2 - 6) && dy < (player.height / 2 + obs.height / 2 - 6)) {
                    createExplosion(player.x, player.y, '#ff0055', 35);
                    audio.playHit();
                    endGame();
                    return;
                }
            }

            // Coletáveis (Orbes)
            for (let i = collectibles.length - 1; i >= 0; i--) {
                const item = collectibles[i];
                const dist = Math.hypot(player.x - item.x, player.y - item.y);

                if (dist < player.width / 2 + item.radius) {
                    score += 150;
                    scoreDisplay.textContent = score;
                    createExplosion(item.x, item.y, '#00f3ff', 15);
                    audio.playCollect();
                    collectibles.splice(i, 1);
                }
            }
        }

        // --- CICLO PRINCIPAL DO JOGO (GAME LOOP) ---
        function spawnEntities() {
            frameCount++;

            // Gerar Obstáculos
            if (frameCount % Math.max(20, Math.floor(60 - speed * 3)) === 0) {
                obstacles.push(new Obstacle());
            }

            // Gerar Coletáveis
            if (frameCount % 90 === 0) {
                collectibles.push(new Collectible());
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            // Limpar e desenhar cenário
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            // Atualização contínua de pontuação/dificuldade
            score += 1;
            scoreDisplay.textContent = score;
            speed = 6 + Math.floor(score / 500) * 0.8;

            processKeyboardInput();

            // Atualizar e desenhar Player
            player.update();
            player.draw();

            // Gerenciar Entidades
            spawnEntities();

            // Atualizar e Desenhar Obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                // Remover se sair da tela
                if (obstacles[i].y > canvas.height + 50) {
                    obstacles.splice(i, 1);
                }
            }

            // Atualizar e Desenhar Coletáveis
            for (let i = collectibles.length - 1; i >= 0; i--) {
                collectibles[i].update();
                collectibles[i].draw();

                if (collectibles[i].y > canvas.height + 50) {
                    collectibles.splice(i, 1);
                }
            }

            // Atualizar Partículas
            updateParticles();
            drawParticles();

            // Checar Colisões
            checkCollisions();

            requestAnimationFrame(gameLoop);
        }

        // --- CONTROLE DE ESTADO (INÍCIO / GAMEOVER) ---
        function startGame() {
            audio.init();
            audio.playStart();

            // Resetar Variáveis
            score = 0;
            speed = 6;
            frameCount = 0;
            obstacles = [];
            collectibles = [];
            particles = [];
            player.x = canvas.width / 2;
            player.targetX = canvas.width / 2;

            scoreDisplay.textContent = '0';
            highScoreHUDDisplay.textContent = highScore;

            // UI Transitions
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');

            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;

            // Atualizar Recorde
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_dash_highscore', highScore);
            }

            finalScore.textContent = score;
            finalHighScore.textContent = highScore;
            menuHighScore.textContent = highScore;

            hud.classList.add('hidden');

            // Exibir Game Over com pequeno atraso para a explosão ser vista
            setTimeout(() => {
                gameOverScreen.classList.remove('hidden');
            }, 400);
        }

        // Event Listeners dos Botões
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Renderizar fundo inicial no menu
        drawBackground();
    </script>
</body>
</html>
